<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#c8102e">
  <meta name="description" content="Base de datos de clientes de Alimentos Nutrimax">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <title>Nutrimax Clientes</title>
</head>
<body> 
  <div id="loginScreen" style="max-width:420px;margin:80px auto;padding:30px;background:white;border-radius:16px;box-shadow:0 8px 30px rgba(0,0,0,.12);">
  <h2 style="margin-top:0;">NUTRIMAX</h2>
  <p>Acceso a clientes</p>

  <label>Correo electrónico</label>
  <input id="loginEmail" type="email" autocomplete="email" style="width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

  <label>Contraseña</label>
  <input id="loginPassword" type="password" autocomplete="current-password" style="width:100%;padding:12px;margin:8px 0 16px;box-sizing:border-box;">

  <button id="loginBtn" type="button" style="width:100%;padding:13px;background:#d10a28;color:white;border:0;border-radius:10px;font-weight:700;">
    Iniciar sesión
  </button>

  <p id="loginError" style="color:#d10a28;margin-top:14px;"></p>
</div>
  <header id="appHeader" class="topbar" style="display:none;">
    <div class="brand">
      <div class="brand-mark">N</div>
      <div>
        <div class="brand-name">NUTRIMAX</div>
        <div class="brand-sub">Clientes</div>
      </div>
    </div>
    <button id="installBtn" class="install-btn hidden">Instalar</button>
    <button id="logoutBtn" class="install-btn">Cerrar sesión</button>
  </header>

 <main id="appMain" class="container" style="display:none;">
    <section class="hero">
      <div>
        <h1>Mis clientes</h1>
        <p>Administra fácilmente la información comercial de Nutrimax.</p>
      </div>
      <button id="newClientBtn" class="primary">+ Nuevo cliente</button>
    </section>

    <section class="stats">
      <div class="stat-card"><span id="totalClients">0</span><small>Clientes registrados</small></div>
      <div class="stat-card"><span id="cityCount">0</span><small>Ciudades</small></div>
    </section>

    <section class="toolbar">
      <input id="searchInput" type="search" placeholder="Buscar negocio, encargado, teléfono, ciudad o barrio...">
      <select id="cityFilter">
        <option value="">Todas las ciudades</option>
      </select>
    </section>

    <section id="emptyState" class="empty">
      <div class="empty-icon">👥</div>
      <h2>Aún no tienes clientes</h2>
      <p>Agrega tu primer negocio para comenzar tu base de datos.</p>
      <button class="primary" id="emptyNewBtn">Agregar cliente</button>
    </section>

    <section id="clientList" class="client-list"></section>
  </main>

  <div id="modal" class="modal hidden" aria-hidden="true">
    <div class="modal-card">
      <div class="modal-head">
        <h2 id="modalTitle">Nuevo cliente</h2>
        <button id="closeModal" class="close">×</button>
      </div>
      <form id="clientForm">
        <input type="hidden" id="clientId">
        <label>Nombre del negocio *
          <input id="businessName" required maxlength="100" autocomplete="organization">
        </label>
        <label>Encargado de compras *
          <input id="buyerName" required maxlength="100" autocomplete="name">
        </label>
        <label>Teléfono *
          <input id="phone" required maxlength="30" inputmode="tel" autocomplete="tel">
        </label>
        <label>Tipo de contacto *
  <select id="tipoCliente" required>
    <option value="Cliente">Cliente</option>
    <option value="Prospecto">Prospecto</option>
  </select>
</label>
        <label>Dirección *
          <input id="address" required maxlength="150" autocomplete="street-address">
        </label>
        <div class="two-col">
          <label>Ciudad *
            <input id="city" required maxlength="80" autocomplete="address-level2">
          </label>
          <label>Zona / barrio
            <input id="neighborhood" maxlength="80">
          </label>
        </div>
        <div class="form-actions">
          <button type="button" id="cancelBtn" class="secondary">Cancelar</button>
          <button type="submit" class="primary">Guardar cliente</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast" class="toast"></div>
 <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
